name: Test and deploy studio
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: node --test tests/*.test.mjs
      - run: python tests/test_codec.py
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Browser workflow and mobile checks
        run: |
          node scripts/serve.mjs > /tmp/studio-preview.log 2>&1 &
          STUDIO_PID=$!
          trap 'kill "$STUDIO_PID"' EXIT
          node tests/workspace-browser.mjs
          node tests/toolbar-browser.mjs
          node tests/text-path-browser.mjs
          node tests/artwork-tools-browser.mjs
          node tests/browser.mjs
          node tests/svg-browser.mjs
          node tests/digitizing-browser.mjs
          node tests/travel-browser.mjs
          node tests/editor-browser.mjs
          node tests/ux-browser.mjs
          node tests/creative-browser.mjs
          node tests/pes-browser.mjs
          node tests/properties-browser.mjs
          node tests/satin-browser.mjs
          node tests/manual-artwork-browser.mjs
          node tests/drawing-style-browser.mjs
          node tests/tool-context-browser.mjs
          node tests/sewing-actions-browser.mjs
          node tests/corner-density-browser.mjs
          node tests/method-categories-browser.mjs
          node tests/path-editing-browser.mjs
          node tests/manual-rails-browser.mjs
      - run: node scripts/build.mjs
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: test-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/deploy-pages@v4
        id: deployment
